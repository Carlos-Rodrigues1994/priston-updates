; =============================================================================
; CONFIGURACAO DE MIX (SISTEMA DE MIXAGEM + JANELA LISTA DE MIX)
; =============================================================================
; Qualquer alteracao neste arquivo atualiza AUTOMATICAMENTE:
;   1. As receitas de Mix no NPC (Sheltons necessarios e Atributos ganhos)
;   2. A janela "Lista de Mix" (/mix e NPC Lista de Mix)
;   3. O nome do Mix exibido no item mixado
;   (No jogo/servidor aberto, voce tambem pode usar /reload_mix com GM)
;
; CATEGORIAS DISPONIVEIS (Campo Categoria=):
;   Armas      -> Machados, Garras, Martelos, Cajados, Lancas, Arcos, Espadas, Foices
;   Armaduras  -> Armaduras e Roupões (sinDA1, sinDA2)
;   Escudos    -> Escudos (sinDS1)
;   Orbs       -> Orbitais (sinOM1)
;   Braceletes -> Braceletes (sinOA2)
;   Luvas      -> Luvas (sinDG1)
;   Botas      -> Botas (sinDB1)
;   Amuletos   -> Amuletos (sinOA1)
;   Aneis      -> Aneis (sinOR1)
;
; SHELTONS DISPONIVEIS:
;   Lucidy, Sereneo, Fadeo, Sparky, Raident, Transparo, Murki,
;   Devine, Celesto, Mirage, Inferna, Enigma, Bellum, Ordo
;
; ATRIBUTOS DISPONIVEIS (Ate 8 atributos ativos maiores que 0 por Mix):
;   ATK_Min, ATK_Max, Taxa_ATK, Vel_ATK, Critico, Defesa, Absorcao,
;   Bloqueio, Velocidade, HP, Mana, Res, Regen_HP, Regen_Mana, Regen_Res,
;   Fogo, Gelo, Raio, Veneno, Organico
;   (Dica: coloque % apos o numero se quiser bonus em porcentagem, ex: ATK_Min=10%)
; =============================================================================


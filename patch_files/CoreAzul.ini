; =============================================================================
; CONFIGURACAO DO CORE AZUL (TELEPORTE) - OrientePT/PK
; =============================================================================
; - Voce pode configurar ate 50 mapas ([Mapa0] ate [Mapa49]), 10 por pagina:
;     Pagina 1: [Mapa0]  ate [Mapa9]
;     Pagina 2: [Mapa10] ate [Mapa19]
;     Pagina 3: [Mapa20] ate [Mapa29]
;     Pagina 4: [Mapa30] ate [Mapa39]
;     Pagina 5: [Mapa40] ate [Mapa49]
; - Campos de cada [MapaX]:
;     Ativo  = 1 para ativar o mapa na lista, 0 para desativar/ocultar
;     Nome   = Texto exibido na linha do Core Azul
;     MapaID = ID numerico exato do mapa em field.cpp (veja a tabela abaixo)
;     Level  = Nivel minimo necessario para teleportar
; - Dica GM: edite este arquivo em C:\PTServer\Server\Config\CoreAzul.ini e
;   use /reload_core no jogo para sincronizar imediatamente com todos os players!
;
; =============================================================================
; TABELA OFICIAL DE IDs DOS MAPAS (field.cpp - Cliente e Servidor):
;   0  = Mata das Acacias (fore-3)      | 27 = Estrada de Ferro do Caos (iron-1)
;   1  = Floresta Bamboo (fore-2)       | 28 = Coracao de Perum (iron-2)
;   2  = Jardim da Liberdade (fore-1)   | 29 = Eura (ice_ura)
;   3  = Ricarten (village-2)           | 30 = SoD / Bellatra (sod-1)
;   4  = Refugio dos Ancioes (ruin-4)   | 31 = Vale Gallubia (ice1)
;   5  = Castelo dos Perdidos (ruin-3)  | 32 = Sala de Quest (quest_IV)
;   6  = Vila Ruinen (ruin-2)           | 33 = Castelo Bless (castle)
;   7  = Terra Maldita (ruin-1)         | 34 = Lago da Ganancia (Greedy)
;   8  = Terra Esquecida (De-1)         | 35 = Santuario Congelado (ice_2)
;   9  = Navisko (village-1)            | 36 = Covil do Kelvezu (Boss)
;   10 = Oasis (De-2)                   | 37 = Ilha Perdida (lostisland)
;   11 = Campo de Batalha Ancioes(De-3) | 38 = Templo Perdido (lost_temple)
;   12 = Terra Proibida (De-4)          | 39 = Fall Game (fall_game)
;   13 = Calabouco Antigo 1 (dun-1)     | 40 = Torre Sem Fim 1 (dun-7)
;   14 = Calabouco Antigo 2 (dun-2)     | 41 = Torre Sem Fim 2 (dun-8)
;   15 = Calabouco Antigo 3 (dun-3)     | 42 = Templo Maldito 3 (Dun-6a)
;   16 = Sala do GM (office)            | 43 = Torre Sem Fim 3 (dun-9)
;   17 = Floresta dos Espiritos (ff-04) | 44 = Laboratorio Secreto (slab)
;   18 = Floresta das Ilusoes (ff-03)   | 45 = Arma Antiga (ancientW)
;   19 = Vale da Tranquilidade (ff-02)  | 46 = Mina de Gelo 1 (mine-1)
;   20 = Estrada dos Ventos (ff-01)     | 47 = Arredores da Torre (lost3)
;   21 = Pillai (pilai)                 | 48 = Boss Dark (dark_boss)
;   22 = Templo Maldito 1 (dun-4)       | 49 = Arena de Batalha (ba1)
;   23 = Templo Maldito 2 (dun-5)       | 50 = Nucleo de Ferro (iron3)
;   24 = Caverna dos Cogumelos (Tcave)  | 51 = Abismo do Mar (SeaA)
;   25 = Caverna das Abelhas (Mcave)    | 52 = Ricarten Antiga (old_village-2)
;   26 = Santuario Sombrio (Dcave)
; =============================================================================

